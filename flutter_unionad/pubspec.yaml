version: 3.0.0
homepage: https://github.com/gstory0404/flutter_unionad

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
#  unionad_interface:
