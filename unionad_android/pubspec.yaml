name: unionad_android
description: Android implementation of the flutter_unionad plugin.
version: 1.0.0
homepage: https://github.com/gstory0404/flutter_unionad

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
#  unionad_interface:
#    path: ../unionad_interface
  unionad_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_unionad
    platforms:
      android:
        package: com.gstory.flutter_unionad
        pluginClass: FlutterUnionadPlugin
        dartPluginClass: UnionadAndroid
